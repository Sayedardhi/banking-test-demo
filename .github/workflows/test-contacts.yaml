# contacts test pipeline: pylint + compile, unit and PostgreSQL integration run in parallel;
# Playwright journeys run against a stack built from this checkout once those layers produced
# valid reports. Every suite runs once; the dashboard run is assembled from the same reports.
name: "Tests: contacts"

on:
  pull_request:
  push:
    branches: [demo-baseline, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-contacts-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # Shared Playwright journeys + compose.source.yaml from PR #10. Used only when the checkout has no tests/e2e.
  E2E_SUITE_REF: 9c96622ccb4c45ef19bc5de793f704d1198657c4
  REPORTS: ${{ github.workspace }}/reports
  SERVICE_DIR: src/accounts/contacts

jobs:
  checks:
    name: Pylint + compile
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: src/accounts/contacts/uv.lock
      - name: Pylint (service code and test helpers)
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          mkdir -p "$REPORTS/checks"
          uv run --frozen pylint --rcfile=../../../.pylintrc contacts.py db.py scripts/*.py | tee "$REPORTS/checks/pylint.txt"
      - name: Compile service and test sources
        working-directory: ${{ env.SERVICE_DIR }}
        run: uv run --frozen python -m compileall -q contacts.py db.py tests scripts
      - name: Upload lint output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contacts-checks
          path: ${{ env.REPORTS }}/checks
          if-no-files-found: warn

  unit:
    name: Unit (pytest, mocked ContactsDb)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      code: ${{ steps.tests.outputs.code }}
      harness: ${{ steps.result.outputs.harness }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: src/accounts/contacts/uv.lock
      - name: Unit tests
        id: tests
        run: |
          set +e
          "$SERVICE_DIR/scripts/report-tests.sh" unit "$REPORTS/unit"
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Layer result
        id: result
        if: always()
        run: |
          python3 "$SERVICE_DIR/scripts/summarize.py" --markdown unit="$REPORTS/unit" >> "$GITHUB_STEP_SUMMARY"
          python3 "$SERVICE_DIR/scripts/summarize.py" --harness unit="$REPORTS/unit" >> "$GITHUB_OUTPUT"
      - name: Upload unit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contacts-unit-reports
          path: ${{ env.REPORTS }}/unit
          if-no-files-found: warn
      - name: Fail on unit test failures
        if: steps.tests.outputs.code != '0'
        run: echo "::error::contacts unit layer exited ${{ steps.tests.outputs.code }}" && exit 1

  integration:
    name: Integration (Flask + Testcontainers PostgreSQL)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      code: ${{ steps.tests.outputs.code }}
      harness: ${{ steps.result.outputs.harness }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: src/accounts/contacts/uv.lock
      - name: Integration tests (disposable postgres:16-alpine, accounts-db schema)
        id: tests
        run: |
          set +e
          "$SERVICE_DIR/scripts/report-tests.sh" integration "$REPORTS/integration"
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Layer result
        id: result
        if: always()
        run: |
          python3 "$SERVICE_DIR/scripts/summarize.py" --markdown integration="$REPORTS/integration" >> "$GITHUB_STEP_SUMMARY"
          python3 "$SERVICE_DIR/scripts/summarize.py" --harness integration="$REPORTS/integration" >> "$GITHUB_OUTPUT"
      - name: Remove leftover test containers
        if: always()
        run: docker ps -aq --filter label=org.testcontainers=true | xargs -r docker rm -f
      - name: Upload integration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contacts-integration-reports
          path: ${{ env.REPORTS }}/integration
          if-no-files-found: warn
      - name: Fail on integration test failures
        if: steps.tests.outputs.code != '0'
        run: echo "::error::contacts integration layer exited ${{ steps.tests.outputs.code }}" && exit 1

  e2e:
    name: E2E (Playwright, source-built stack)
    needs: [checks, unit, integration]
    # Gate on valid prerequisite results, not on passing tests: known findings in unit/integration
    # must not hide the browser journeys.
    if: ${{ !cancelled() && needs.checks.result == 'success' && needs.unit.outputs.harness == 'ok' && needs.integration.outputs.harness == 'ok' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      code: ${{ steps.contacts.outputs.code }}
      journeys: ${{ steps.journeys.outputs.code }}
    env:
      E2E_VIDEO: 'on'
      E2E_TRACE: 'on'
      E2E_BASE_URL: http://localhost:18080
      AUDIT_URL: http://localhost:18090
      AUDIT_TOKEN: local-demo-audit-token
      MAVEN_MIRROR_URL: https://maven-central.storage-download.googleapis.com/maven2
      COMPOSE: docker compose -p banking-e2e -f compose.yaml -f tests/e2e/compose.source.yaml
      OUT: ${{ github.workspace }}/reports/e2e
    steps:
      - uses: actions/checkout@v4
      - name: Select shared Playwright suite
        run: |
          if [ -f tests/e2e/package.json ]; then
            echo "E2E_SUITE=tests/e2e from this checkout" >> "$GITHUB_ENV"
          else
            git fetch --no-tags --depth=1 origin "$E2E_SUITE_REF"
            git checkout FETCH_HEAD -- tests/e2e
            git reset -q
            echo "E2E_SUITE=tests/e2e from $E2E_SUITE_REF (PR #10); application code from this checkout" >> "$GITHUB_ENV"
          fi
          mkdir -p "$OUT/contacts" "$OUT/journeys"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            tests/e2e/package-lock.json
            src/accounts/contacts/tests/e2e/package-lock.json
      - name: Install Playwright
        run: |
          (cd tests/e2e && npm ci --no-audit --no-fund)
          (cd "$SERVICE_DIR/tests/e2e" && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium)
      - name: Discover tests (fails on zero)
        run: |
          n=$(cd "$SERVICE_DIR/tests/e2e" && npx playwright test --list | grep -cE '^\s+\[chromium\]' || true)
          j=$(cd tests/e2e && npx playwright test --list | grep -cE '^\s+\[chromium\]' || true)
          echo "Discovered $n contacts and $j shared Playwright tests"
          echo "DISCOVERED=$n contacts, $j shared journeys" >> "$GITHUB_ENV"
          test "$n" -gt 0 && test "$j" -gt 0
      - name: Build contacts and the banking stack from this checkout
        run: |
          mkdir -p .local/keys
          openssl genrsa -out .local/keys/privatekey 2048
          openssl rsa -in .local/keys/privatekey -pubout -out .local/keys/publickey
          if ! $COMPOSE up -d --build --wait --wait-timeout 900; then
            $COMPOSE ps -a
            for s in $($COMPOSE ps -a --status exited --format '{{.Service}}'); do
              echo "::group::logs: $s"; $COMPOSE logs --no-color --tail 150 "$s"; echo "::endgroup::"
            done
            exit 1
          fi
          $COMPOSE images | tee "$OUT/stack-images.txt"
      - name: Wait for service readiness
        run: |
          set -x
          for url in "$E2E_BASE_URL/ready" "$E2E_BASE_URL/login" "$AUDIT_URL/health"; do
            timeout 120 bash -c "until curl -fsS -o /dev/null '$url'; do sleep 2; done"
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' "$AUDIT_URL/events")" = 401
          curl -fsS -o /dev/null -H "Authorization: Bearer $AUDIT_TOKEN" "$AUDIT_URL/events"
          # contacts (and every other application image) must be built from this checkout.
          images=$($COMPOSE ps -a --format '{{.Service}} {{.Image}}')
          echo "$images"
          grep -qx 'contacts banking-e2e/contacts:source' <<<"$images"
          ! awk '{print $2}' <<<"$images" | grep -v '^banking-e2e/'
      - name: Playwright contacts journeys
        id: contacts
        run: |
          set +e
          "$SERVICE_DIR/scripts/report-tests.sh" e2e "$OUT/contacts"
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Playwright shared journeys (login, deposit, payment)
        id: journeys
        if: ${{ !cancelled() }}
        working-directory: tests/e2e
        env:
          E2E_STACK: existing
        run: |
          set +e
          bash scripts/report-tests.sh "$OUT/journeys"
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: E2E summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os, xml.etree.ElementTree as ET
          out = os.environ['OUT']
          print('### contacts pipeline: Playwright\n')
          print(f"Shared suite: {os.environ.get('E2E_SUITE', '?')}. Discovered: {os.environ.get('DISCOVERED', '?')}.\n")
          for name in ('contacts', 'journeys'):
              try:
                  cases = ET.parse(f'{out}/{name}/junit.xml').getroot().findall('.//testcase')
                  bad = [c.get('name') for c in cases if c.find('failure') is not None or c.find('error') is not None]
                  skipped = sum(c.find('skipped') is not None for c in cases)
                  print(f'- {name}: tests {len(cases)}, passed {len(cases) - len(bad) - skipped}, failed {len(bad)}, skipped {skipped}')
                  for case in bad:
                      print(f'  - failed: {case}')
              except Exception as ex:
                  print(f'- {name}: no JUnit report ({type(ex).__name__})')
          PY
      - name: Collect service logs and stop the stack
        if: always()
        run: |
          [ -f tests/e2e/compose.source.yaml ] || exit 0
          $COMPOSE ps -a > "$OUT/compose-ps.txt" 2>&1 || true
          $COMPOSE logs --no-color > "$OUT/compose-logs.txt" 2>&1 || true
          $COMPOSE logs --no-color contacts > "$OUT/contacts.log" 2>&1 || true
          $COMPOSE down --remove-orphans || true
      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contacts-e2e-junit
          path: |
            reports/e2e/contacts/junit.xml
            reports/e2e/journeys/junit.xml
          if-no-files-found: warn
      - name: Upload Playwright HTML reports, traces, screenshots and videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contacts-e2e-playwright-report
          path: |
            reports/e2e/*/playwright-report.zip
            reports/e2e/*/playwright-results.zip
          if-no-files-found: warn
      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contacts-e2e-service-logs
          path: |
            reports/e2e/*.txt
            reports/e2e/*.log
          if-no-files-found: warn
      - name: Fail on Playwright failures
        if: steps.contacts.outputs.code != '0' || steps.journeys.outputs.code != '0'
        run: |
          echo "::error::Playwright exited contacts=${{ steps.contacts.outputs.code }} journeys=${{ steps.journeys.outputs.code }}"
          exit 1

  report:
    name: Pipeline summary + dashboard run
    needs: [checks, unit, integration, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: ${{ env.REPORTS }}
      - name: Job summary by layer
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CHECKS: ${{ needs.checks.result }}
          UNIT: ${{ needs.unit.result }}
          INTEGRATION: ${{ needs.integration.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          {
            echo "## contacts pipeline"
            echo
            echo "| Stage | Job result | Reports |"
            echo "|---|---|---|"
            echo "| Pylint + compile | $CHECKS | [contacts-checks]($RUN_URL#artifacts) |"
            echo "| Unit | $UNIT | [contacts-unit-reports]($RUN_URL#artifacts) |"
            echo "| Integration | $INTEGRATION | [contacts-integration-reports]($RUN_URL#artifacts) |"
            echo "| E2E (Playwright) | $E2E | [contacts-e2e-playwright-report, contacts-e2e-junit, contacts-e2e-service-logs]($RUN_URL#artifacts) |"
            echo
            python3 "$SERVICE_DIR/scripts/summarize.py" --markdown \
              unit="$REPORTS/contacts-unit-reports" integration="$REPORTS/contacts-integration-reports" \
              e2e="$REPORTS/contacts-e2e-junit/contacts" journeys-e2e="$REPORTS/contacts-e2e-junit/journeys"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Dashboard-compatible run (from the reports above, no re-execution)
        if: always()
        run: |
          id=$(python3 "$SERVICE_DIR/scripts/dashboard_run.py" \
            "contacts:unit:${{ needs.unit.outputs.code || 'none' }}:$REPORTS/contacts-unit-reports" \
            "contacts:integration:${{ needs.integration.outputs.code || 'none' }}:$REPORTS/contacts-integration-reports" \
            "contacts:e2e:${{ needs.e2e.outputs.code || 'none' }}:$REPORTS/contacts-e2e-junit/contacts" \
            "journeys:e2e:${{ needs.e2e.outputs.journeys || 'none' }}:$REPORTS/contacts-e2e-junit/journeys")
          echo "Dashboard run $id"
          echo "Dashboard run \`$id\`: unzip into \`.local/test-observability/runs/\` and run \`dashboard.py serve\`." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload dashboard run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contacts-dashboard-run
          path: .local/test-observability/runs/
          if-no-files-found: warn
      - name: Final status (test failures stay visible)
        if: always()
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ['RESULTS'])
          bad = {k: v['result'] for k, v in needs.items() if v['result'] != 'success'}
          for k, v in bad.items():
              print(f'::error::{k}: {v}')
          sys.exit(1 if bad else 0)
          PY
