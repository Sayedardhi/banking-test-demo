# ledgerwriter (transaction processing) test pipeline.
# Checkstyle + compile, unit and PostgreSQL integration run in parallel. Playwright journeys run
# against a stack built from this checkout once those jobs produced valid reports (findings do not
# block them). Every suite runs exactly once; the summary and dashboard run reuse its reports.
name: "Tests: ledgerwriter"

on:
  pull_request:
  push:
    branches: [demo-baseline, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-ledgerwriter-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # Journeys commit from PR #10, used only when this checkout has no tests/e2e directory.
  E2E_SUITE_REF: 9c96622ccb4c45ef19bc5de793f704d1198657c4
  REPORTS: ${{ github.workspace }}/reports
  SUMMARIZE: src/ledger/ledgerwriter/scripts/summarize.py

jobs:
  checks:
    name: Checkstyle + compile
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Checkstyle (module checkstyle.xml, main and test sources)
        run: |
          mkdir -p "$REPORTS/checks"
          ./mvnw -B -pl src/ledger/ledgerwriter checkstyle:check -Dcheckstyle.includeTestSourceDirectory=true \
            2>&1 | tee "$REPORTS/checks/checkstyle.log"
      - name: Compile main and test sources
        run: ./mvnw -B -pl src/ledger/ledgerwriter test-compile -Dcheckstyle.skip=true
      - name: Upload Checkstyle output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledgerwriter-checkstyle
          path: |
            ${{ env.REPORTS }}/checks
            src/ledger/ledgerwriter/target/checkstyle-result.xml
          if-no-files-found: warn

  unit:
    name: Unit (JUnit 5 + Mockito)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      code: ${{ steps.tests.outputs.code }}
      harness: ${{ steps.result.outputs.harness }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Unit tests
        id: tests
        run: |
          set +e
          src/ledger/ledgerwriter/scripts/report-tests.sh unit "$REPORTS/unit"
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Layer result
        id: result
        if: always()
        run: |
          python3 "$SUMMARIZE" --markdown unit="$REPORTS/unit" >> "$GITHUB_STEP_SUMMARY"
          python3 "$SUMMARIZE" --harness unit="$REPORTS/unit" | tee -a "$GITHUB_OUTPUT"
      - name: Upload unit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledgerwriter-unit-reports
          path: ${{ env.REPORTS }}/unit
          if-no-files-found: warn
      - name: Fail on unit test failures
        if: steps.tests.outputs.code != '0'
        run: echo "::error::ledgerwriter unit layer exited ${{ steps.tests.outputs.code }}" && exit 1

  integration:
    name: Integration (Spring Boot + Testcontainers PostgreSQL 16)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      code: ${{ steps.tests.outputs.code }}
      harness: ${{ steps.result.outputs.harness }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Integration tests
        id: tests
        run: |
          set +e
          src/ledger/ledgerwriter/scripts/report-tests.sh integration "$REPORTS/integration"
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Layer result
        id: result
        if: always()
        run: |
          python3 "$SUMMARIZE" --markdown integration="$REPORTS/integration" >> "$GITHUB_STEP_SUMMARY"
          python3 "$SUMMARIZE" --harness integration="$REPORTS/integration" | tee -a "$GITHUB_OUTPUT"
      - name: Remove leftover Testcontainers containers
        if: always()
        run: docker ps -aq --filter label=org.testcontainers=true | xargs -r docker rm -f
      - name: Upload integration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledgerwriter-integration-reports
          path: ${{ env.REPORTS }}/integration
          if-no-files-found: warn
      - name: Fail on integration test failures
        if: steps.tests.outputs.code != '0'
        run: echo "::error::ledgerwriter integration layer exited ${{ steps.tests.outputs.code }}" && exit 1

  e2e:
    name: E2E (Playwright, source-built stack)
    needs: [checks, unit, integration]
    # Requires a clean compile and valid unit/integration reports; failing findings do not block it.
    if: ${{ !cancelled() && needs.checks.result == 'success' && needs.unit.outputs.harness == 'ok' && needs.integration.outputs.harness == 'ok' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      code: ${{ steps.tests.outputs.code }}
    env:
      E2E_BASE_URL: http://localhost:18080
      AUDIT_URL: http://localhost:18090
      AUDIT_TOKEN: local-demo-audit-token
      COMPOSE: docker compose -p banking-e2e -f compose.yaml -f tests/e2e/compose.source.yaml
      OUT: ${{ github.workspace }}/reports/e2e
    steps:
      - uses: actions/checkout@v4
      - name: Select Playwright suite
        run: |
          if [ -f tests/e2e/package.json ]; then
            echo "E2E_SUITE=tests/e2e from this checkout" >> "$GITHUB_ENV"
          else
            git fetch --no-tags --depth=1 origin "$E2E_SUITE_REF"
            git checkout FETCH_HEAD -- tests/e2e
            git reset -q
            echo "E2E_SUITE=tests/e2e from $E2E_SUITE_REF (PR #10); application code from this checkout" >> "$GITHUB_ENV"
          fi
          mkdir -p "$OUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Discover tests (fail on zero)
        working-directory: tests/e2e
        run: |
          n=$(npx playwright test --list | grep -cE '^\s+\[chromium\]' || true)
          echo "Discovered $n Playwright tests"
          echo "DISCOVERED=$n" >> "$GITHUB_ENV"
          test "$n" -gt 0
      - name: Build ledgerwriter and the stack from this checkout
        run: |
          mkdir -p .local/keys
          openssl genrsa -out .local/keys/privatekey 2048
          openssl rsa -in .local/keys/privatekey -pubout -out .local/keys/publickey
          if ! $COMPOSE up -d --build --wait --wait-timeout 900; then
            $COMPOSE ps -a
            $COMPOSE logs --no-color --tail 150
            exit 1
          fi
      - name: Wait for readiness and verify source images
        run: |
          for url in "$E2E_BASE_URL/ready" "$E2E_BASE_URL/login" "$AUDIT_URL/health"; do
            timeout 120 bash -c "until curl -fsS -o /dev/null '$url'; do sleep 2; done"
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' "$AUDIT_URL/events")" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $AUDIT_TOKEN" "$AUDIT_URL/events")" = 200
          images=$($COMPOSE ps -a --format '{{.Service}} {{.Image}}')
          echo "$images" | tee "$OUT/stack-images.txt"
          grep -qx 'ledgerwriter banking-e2e/ledgerwriter:source' <<<"$images"
      - name: Playwright journeys
        id: tests
        working-directory: tests/e2e
        env:
          E2E_STACK: existing
        run: |
          set +e
          bash scripts/report-tests.sh "$OUT"
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: E2E summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os, xml.etree.ElementTree as ET
          out = os.environ['OUT']
          print('### ledgerwriter pipeline: Playwright journeys\n')
          print(f"Suite: {os.environ.get('E2E_SUITE', '?')}. Discovered: {os.environ.get('DISCOVERED', '?')}.\n")
          try:
              cases = ET.parse(f'{out}/junit.xml').getroot().findall('.//testcase')
          except (OSError, ET.ParseError) as ex:
              print(f'No JUnit report ({type(ex).__name__}).')
          else:
              bad = [c.get('name') for c in cases if c.find('failure') is not None or c.find('error') is not None]
              skipped = sum(c.find('skipped') is not None for c in cases)
              print(f'Tests {len(cases)}, passed {len(cases) - len(bad) - skipped}, failed {len(bad)}, skipped {skipped}.')
              for name in bad:
                  print(f'- failed: {name}')
          PY
      - name: Collect service logs
        if: always()
        run: |
          [ -f tests/e2e/compose.source.yaml ] || exit 0
          $COMPOSE ps -a > "$OUT/compose-ps.txt" 2>&1 || true
          $COMPOSE logs --no-color > "$OUT/compose-logs.txt" 2>&1 || true
          $COMPOSE logs --no-color ledgerwriter > "$OUT/ledgerwriter.log" 2>&1 || true
      - name: Upload Playwright JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledgerwriter-e2e-junit
          path: reports/e2e/junit.xml
          if-no-files-found: warn
      - name: Upload Playwright HTML report, traces, screenshots and videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledgerwriter-e2e-playwright-report
          path: |
            reports/e2e/playwright-report.zip
            reports/e2e/playwright-results.zip
          if-no-files-found: warn
      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledgerwriter-e2e-service-logs
          path: |
            reports/e2e/*.txt
            reports/e2e/*.log
          if-no-files-found: warn
      - name: Stop the stack (volumes are kept)
        if: always()
        run: |
          [ -f tests/e2e/compose.source.yaml ] || exit 0
          $COMPOSE down --remove-orphans || true
      - name: Fail on Playwright failures
        if: steps.tests.outputs.code != '0'
        run: echo "::error::Playwright exited ${{ steps.tests.outputs.code }}" && exit 1

  report:
    name: Pipeline summary + dashboard run
    needs: [checks, unit, integration, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: ${{ env.REPORTS }}
      - name: Job summary by layer
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CHECKS: ${{ needs.checks.result }}
          UNIT: ${{ needs.unit.result }}
          INTEGRATION: ${{ needs.integration.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          {
            echo "## ledgerwriter pipeline"
            echo
            echo "| Stage | Job result | Artifacts |"
            echo "|---|---|---|"
            echo "| Checkstyle + compile | $CHECKS | [ledgerwriter-checkstyle]($RUN_URL#artifacts) |"
            echo "| Unit | $UNIT | [ledgerwriter-unit-reports]($RUN_URL#artifacts) |"
            echo "| Integration | $INTEGRATION | [ledgerwriter-integration-reports]($RUN_URL#artifacts) |"
            echo "| E2E (Playwright) | $E2E | [ledgerwriter-e2e-playwright-report, ledgerwriter-e2e-junit, ledgerwriter-e2e-service-logs]($RUN_URL#artifacts) |"
            echo
            python3 "$SUMMARIZE" --markdown \
              unit="$REPORTS/ledgerwriter-unit-reports" integration="$REPORTS/ledgerwriter-integration-reports"
            echo
            python3 - <<'PY'
          import os, xml.etree.ElementTree as ET
          path = os.path.join(os.environ['REPORTS'], 'ledgerwriter-e2e-junit', 'junit.xml')
          try:
              cases = ET.parse(path).getroot().findall('.//testcase')
          except (OSError, ET.ParseError):
              print('E2E: no JUnit report (job skipped or did not reach Playwright).')
          else:
              bad = sum(c.find('failure') is not None or c.find('error') is not None for c in cases)
              skipped = sum(c.find('skipped') is not None for c in cases)
              print(f'E2E (journeys): {len(cases)} tests, {len(cases) - bad - skipped} passed, {bad} failed, '
                    f'{skipped} skipped. Browser tests do not measure ledgerwriter code coverage.')
          PY
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Dashboard-compatible run (from the downloaded reports, no re-execution)
        if: always()
        run: |
          mkdir -p "$REPORTS/e2e"
          cp "$REPORTS"/ledgerwriter-e2e-junit/* "$REPORTS"/ledgerwriter-e2e-playwright-report/* "$REPORTS/e2e/" 2>/dev/null || true
          id=$(python3 src/ledger/ledgerwriter/scripts/dashboard_run.py \
            "ledgerwriter:unit:${{ needs.unit.outputs.code || 'none' }}:$REPORTS/ledgerwriter-unit-reports" \
            "ledgerwriter:integration:${{ needs.integration.outputs.code || 'none' }}:$REPORTS/ledgerwriter-integration-reports" \
            "journeys:e2e:${{ needs.e2e.outputs.code || 'none' }}:$REPORTS/e2e")
          echo "Dashboard run \`$id\`: unzip into \`.local/test-observability/runs/\` and run \`dashboard.py serve\`." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload dashboard run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledgerwriter-dashboard-run
          path: .local/test-observability/runs/
          if-no-files-found: warn
      - name: Final status (failing tests stay red)
        if: always()
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          bad = {k: v['result'] for k, v in json.loads(os.environ['RESULTS']).items() if v['result'] != 'success'}
          for job, result in bad.items():
              print(f'::error::{job}: {result}')
          sys.exit(1 if bad else 0)
          PY
