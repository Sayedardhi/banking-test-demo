name: test-coverage

on:
  pull_request:
    paths:
      - 'src/audit/**'
      - 'src/ledger/ledgerwriter/**'
      - 'src/ledger/ledger-db/**'
      - 'src/frontend/**'
      - 'tests/e2e/**'
      - 'compose.yaml'
      - 'scripts/ci/**'
      - '.github/workflows/test-coverage.yaml'
  push:
    branches: [demo-baseline]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: audit (TypeScript) - unit + integration
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/audit/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Tests with coverage
        run: npm run coverage
      - name: Summary
        if: always()
        working-directory: .
        run: |
          rc=0
          python3 scripts/ci/test-summary.py junit "audit unit" src/audit/test-results/unit.xml || rc=1
          python3 scripts/ci/test-summary.py junit "audit integration (real temp SQLite + HTTP)" src/audit/test-results/integration.xml || rc=1
          python3 scripts/ci/test-summary.py c8 "audit coverage (unit + integration, all src files)" src/audit/coverage/coverage-summary.json || rc=1
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-test-reports
          path: |
            src/audit/coverage/
            src/audit/test-results/

  ledgerwriter:
    name: ledgerwriter (Java) - unit + Postgres integration
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Tests with coverage
        run: ./mvnw -B -pl src/ledger/ledgerwriter -am verify -Dmaven.test.failure.ignore=true
      - name: Summary
        if: always()
        run: |
          rc=0
          R=src/ledger/ledgerwriter/target/surefire-reports
          python3 scripts/ci/test-summary.py junit "ledgerwriter unit" $R/TEST-*.xml --exclude IntegrationTest || rc=1
          python3 scripts/ci/test-summary.py junit "ledgerwriter integration (Testcontainers Postgres)" $R/TEST-*IntegrationTest.xml || rc=1
          python3 scripts/ci/test-summary.py jacoco "ledgerwriter coverage (unit + integration, JaCoCo)" src/ledger/ledgerwriter/target/site/jacoco/jacoco.csv || rc=1
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ledgerwriter-test-reports
          path: |
            src/ledger/ledgerwriter/target/surefire-reports/
            src/ledger/ledgerwriter/target/site/jacoco/

  e2e:
    name: Playwright E2E (Compose stack)
    needs: [audit, ledgerwriter]
    # Runs even when service checks fail so browser evidence is always published.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Start demo stack
        run: |
          docker compose build audit
          ./scripts/start-local.sh
      - name: Wait for login to work end to end
        run: |
          for i in $(seq 1 120); do
            loc=$(curl -s -o /dev/null -w '%{redirect_url}' -X POST -d 'username=testuser&password=bankofanthos' http://localhost:8080/login || true)
            if [[ "$loc" == *"/home"* ]] && curl -sf http://localhost:8090/health >/dev/null; then echo "ready after ${i}x5s"; exit 0; fi
            sleep 5
          done
          docker compose ps; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install Playwright
        working-directory: tests/e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: Playwright tests
        working-directory: tests/e2e
        env:
          CI: 'true'
        run: npx playwright test
      - name: Summary
        if: always()
        run: python3 scripts/ci/test-summary.py junit "Playwright E2E" tests/e2e/test-results/junit.xml
      - name: Collect service logs
        if: always()
        run: docker compose logs --no-color > compose.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
            compose.log
      - name: Stop stack
        if: always()
        run: docker compose down
