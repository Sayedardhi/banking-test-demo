<header>
  <nav class="navbar navbar-top" aria-label="Main navigation"><div class="container">
    <a class="navbar-brand" href="/"><span class="brand-mark" aria-hidden="true">d<span>.</span></span>{{ bank_name }}</a>
    <div class="nav-right"><span class="nav-caption">PERSONAL BANKING</span>
    {% if name %}
      <div class="dropdown"><button class="account-toggle dropdown-toggle" id="accountDropdown" type="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false"><span class="avatar" aria-hidden="true">{{ name[0] }}</span><span id="account-user-name">{{ name }}</span></button>
        <div class="dropdown-menu dropdown-menu-right" aria-labelledby="accountDropdown"><form id="logout-form" method="POST" action="/logout"><button type="submit" class="dropdown-item">Sign out</button></form></div>
      </div>
    {% else %}<span class="demo-badge">Demo environment</span>{% endif %}
    </div>
  </div></nav>
</header>
